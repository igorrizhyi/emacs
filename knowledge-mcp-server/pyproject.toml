[tool.poetry]
name = "knowledge-mcp-server"
version = "0.2.0"
description = "FalkorDB hybrid vector+graph knowledge system for agent-shell team sessions"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
mcp = ">=1.0.0"
litellm = ">=1.0.0"
falkordb = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
