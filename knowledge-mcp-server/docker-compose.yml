services:
  falkordb:
    image: falkordb/falkordb:latest
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "6380:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
